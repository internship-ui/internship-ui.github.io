<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MediUnify - Patient Healthcare</title>
  <meta http-equiv="refresh" content="0; url=https://internship-ui.github.io/Mediunify-patient-side-application-/" />
  <script>
    window.location.replace("https://internship-ui.github.io/Mediunify-patient-side-application-/" + window.location.search + window.location.hash);
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      background-color: #F8FAFC;
      color: #1E293B;
      text-align: center;
      padding: 20px;
      box-sizing: border-box;
    }
    .loader {
      width: 44px;
      height: 44px;
      border: 4px solid #E2E8F0;
      border-top: 4px solid #00B894;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 20px;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    h2 { margin: 0 0 8px 0; font-size: 20px; color: #0F172A; }
    p { margin: 0 0 16px 0; font-size: 14px; color: #64748B; }
    a {
      color: #00B894;
      font-weight: 600;
      text-decoration: none;
      display: inline-block;
      padding: 10px 24px;
      background: #E6F8F4;
      border-radius: 8px;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="loader"></div>
  <h2>Loading MediUnify...</h2>
  <p>Connecting you to MediUnify healthcare platform...</p>
  <a href="https://internship-ui.github.io/Mediunify-patient-side-application-/">Open MediUnify App</a>
</body>
</html>
